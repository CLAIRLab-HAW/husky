name: ci

# husky on its own: no other repository is checked out, and the Python job runs from this repository's
# pyproject.toml, uv.lock and ruff.toml.  The tests that need clearpath live there (deploy/offboard/tests,
# robot/contract/tests, twin/twinlink/tests), and clearpath's own CI runs them.
#
# Three jobs, by toolchain:
#
#   python              src/'s packages and setup/ -- their suites, `bash -n` over the installer scripts,
#                       ruff over everything but cockpit-diagnostics.
#   cockpit-tools       the Cockpit page: `node --check`, `bash -n`, `npm test`.
#   cockpit-diagnostics the upstream-derived plugin: `npm ci`, eslint, stylelint. The upstream's two bot
#                       workflows (cockpit-lib-update, tasks-container-update) are NOT carried over: they open
#                       pull requests against the upstream repository from a Cockpit-project identity, which
#                       has no place in this one.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - run: uv sync

      - name: bash -n over the installer and boot scripts
        working-directory: setup
        run: find . -name '*.sh' -print0 | xargs -0 -n1 bash -n

      - run: uv run ruff check --extend-exclude cockpit-diagnostics .
      # cockpit-diagnostics is upstream code with a [tool.ruff] of its own, formatted to its own rules.
      - run: uv run ruff format --check --extend-exclude cockpit-diagnostics .

      - run: uv run pytest -q

  cockpit-tools:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cockpit-tools
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: for f in *.js test/*.mjs test/preview/base1/*.js; do node --check "$f"; done
      - run: for f in install.sh test/preview/serve.sh; do bash -n "$f"; done
      - run: npm test

  cockpit-diagnostics:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cockpit-diagnostics
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run eslint
      - run: npm run stylelint
