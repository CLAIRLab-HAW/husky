# husky on its own: the tooling the tests and the scripts run with.  No distribution lives here -- src/ is one colcon
# workspace of ROS packages, setup/ the installer and its scripts -- so the tests import the packages from their source
# trees (pythonpath below) and the scripts through their conftest.py.  `uv sync && uv run ruff check . && uv run
# pytest` in a fresh clone of this repository is the whole check; it needs no clearpath checkout around it.

[project]
name = "husky"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.5,<0.17",
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
# importlib: tests/lidar and tests/navigation both have a test_wiring.py, and no package ships a tests/__init__.py.
addopts = "--import-mode=importlib"
pythonpath = [
    "src/husky_bt_joy",
    "src/husky_lidar",
    "src/husky_manipulator_diagnostics",
    "src/husky_navigation",
    "src/husky_octomap_feed",
    "src/husky_ur_state",
]
testpaths = ["setup/tests", "tests"]
