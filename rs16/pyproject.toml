[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clair-rs16"
version = "0.1.0"
description = "The a200-0553's RoboSense RS-LiDAR-16: driver configuration, sensor names, self filter, URDF macro"
readme = "README.md"
authors = [
    { name = "Hannes Philip Voss", email = "mail@hannesvoss.de" },
]
requires-python = ">=3.12"
dependencies = ["pyyaml>=6.0"]

# `clair` is a PEP 420 namespace and carries NO __init__.py.  `include` keeps src/rs16_description, the ament
# package beside it, out of the wheel: a namespace search would take its urdf/ and meshes/ for packages.
[tool.setuptools.packages.find]
where = ["src"]
include = ["clair*"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "e2e_container_nav: end-to-end against the offboard container (up.sh --nav), the driver replaying the recording",
]
