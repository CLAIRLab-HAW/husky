# KDL IK for the interactive MoveIt marker in RViz (computed locally).
#
# Loaded onto the rviz2 node via --params-file. For the planning group defined
# in the SRDF, MoveIt reads robot_description_kinematics.<group>. The real robot
# defines exactly ONE group: 'arm_0' (the 6 UR5 joints, tip
# arm_0_wrist_3_link). KDL derives base/tip from the joints of the group.
#
# Without this file MoveIt stays usable: the joints tab, "Update", plan &
# execute all work; only freely dragging the end-effector ball needs local IK.
/**:
  ros__parameters:
    robot_description_kinematics:
      arm_0:
        kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
        kinematics_solver_search_resolution: 0.005
        kinematics_solver_timeout: 0.05
