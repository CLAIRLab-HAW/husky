[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "clair-navigation"
version = "0.1.0"
description = "Navigation layer of the a200-0553: the RS16's 2D scan and Nav2"
readme = "README.md"
authors = [
    { name = "Hannes Philip Voss", email = "mail@hannesvoss.de" },
]
requires-python = ">=3.12"
dependencies = ["clair-lidar", "pyyaml>=6.0"]

[tool.uv.sources]
clair-lidar = { workspace = true }

# `clair` is a PEP 420 namespace and carries NO __init__.py.
[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
